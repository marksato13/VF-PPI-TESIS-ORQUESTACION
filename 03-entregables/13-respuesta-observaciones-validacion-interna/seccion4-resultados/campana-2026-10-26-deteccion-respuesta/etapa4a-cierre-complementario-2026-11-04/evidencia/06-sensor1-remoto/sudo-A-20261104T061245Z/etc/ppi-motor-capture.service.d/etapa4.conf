# /etc/systemd/system/ppi-motor-capture.service.d/etapa4.conf  (0644 root:root) — Etapa 4.
# Único cambio: rotación del anillo de 15 s a 5 s (-G 5), la configuración con la que se validaron
# el disparo por eventos (Etapa 2, R1–R4) y la detección temprana (Etapa 3). Retención igual
# (cyberflow-limpieza borra lo que tenga > 15 min): 900 s ≥ 230 s de horizonte + 600 s de
# recuperación. Consecuencias declaradas: el hueco de anillo admisible pasa a 5 + 2 s y el cierre
# de un fichero se produce ≤ 5 s después de su inicio (+ 1 s de redondeo de -G).
[Service]
ExecStart=
ExecStart=/usr/bin/tcpdump -i ens37 -n -s 0 -U -B 65536 \
    -Z tcpdump -w /var/lib/ppi-motor-capture/live-%%Y%%m%%d%%H%%M%%S.pcap \
    -G 5
